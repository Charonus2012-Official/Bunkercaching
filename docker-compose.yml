services:
  db:
    image: mariadb:11
    container_name: bunkercaching-db
    restart: unless-stopped
    env_file: docker.env
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: bunkercaching-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file: docker.env

volumes:
  mariadb_data:

<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunkercaching</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="data/logo/bunkercaching_pure_logo.png">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans&family=Staatliches&display=swap" rel="stylesheet">
</head>
<body>
    <nav id="navbar"></nav>

    <header class="hero">
        <h1>Bunkercaching</h1>
        <p>Objevujte historii československého opevnění skrytou v betonu.</p>
        <a href="/map" class="cta-button">Otevřít mapu</a>
    </header>

    <section class="features">
        <div class="feature-card">
            <h3>Interaktivní mapa</h3>
            <p>Tisíce objektů lehkého i těžkého opevnění přehledně na jednom místě.</p>
        </div>
        <div class="feature-card">
            <h3>Zapisujte návštěvy</h3>
            <p>Veďte si vlastní deník navštívených bunkrů a sledujte svůj pokrok.</p>
        </div>
    </section>

    <script src="navbar.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Bunkercaching — Mapa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="../style.css" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans&family=Staatliches&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../data/logo/bunkercaching_pure_logo.png">
    <link rel="stylesheet" href="map.css">
    <link rel="stylesheet" href="search.css">
</head>
<body>
<div id="app">
    <nav id="navbar"></nav>
    <script src="../navbar.js"></script>
  <script> // Set the navbar to static so it doesn't stick!
    document.addEventListener("DOMContentLoaded", () => {
        const navbar = document.getElementById("navbar");
        navbar.style.position = "static"; // default
    });
  </script>
<div id="page">
    <div id="sidebar">
        <div id="sidebar-header">
            <button id="close">Zavřít</button>
        </div>

        <div id="sidetop"></div>
        <div id="sidebottom">
            <form action="/logs/log/", method="get">
                <input type="hidden" name="bunker_id" id="bunker_id" value="">
                <input type="hidden" name="type" id="bunker_type" value="">
                <input type="submit" value="Logovat">
            </form>
        </div>
    </div>
    <!--div id="searchContainer"><input type="text" id="searchInput" placeholder="Hledej"><div id="searchResults"></div></div-->
    <div id="map"></div>
</div>
</div>

<script src="BunkerPlaceSearch.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="map.js"></script>
<script src="obj_listing.js"></script>
<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
}
#app {
    display: flex;
    flex-direction: column;
    height: 100%;
}
</style>
</body>
</html>

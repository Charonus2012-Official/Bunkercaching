<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Bunkercaching — Mapa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="../style.css?v=1.3" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans&family=Staatliches&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../data/logo/bunkercaching_pure_logo.png">
    <link rel="stylesheet" href="map.css?v=1.3">
    <link rel="stylesheet" href="search.css?v=1.3">
</head>
<body>
<div id="app">
    <nav id="navbar"></nav>
    <script src="../navbar.js?v=1.3"></script>
  <script> // Set the navbar height variable for layout if needed
    document.addEventListener("DOMContentLoaded", () => {
        // Any specific map-page navbar adjustments can go here
    });
  </script>
<div id="page">
    <div id="sidebar">
        <div id="sidebar-header">
            <button id="close">Zavřít</button>
        </div>

        <div id="sidetop"></div>
        <div id="sidebottom">
            <form action="/logs/log/", method="get">
                <input type="hidden" name="bunker_id" id="bunker_id" value="">
                <input type="hidden" name="type" id="bunker_type" value="">
                <input type="submit" value="Logovat">
            </form>
        </div>
    </div>
    <div id="searchContainer">
        <button id="searchToggle" class="mobile-only">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
        </button>
        <div id="searchWrapper">
            <input type="text" id="searchInput" placeholder="Hledej">
            <div id="searchResults"></div>
        </div>
    </div>
    <div id="map"></div>
</div>
</div>

<script src="BunkerPlaceSearch.js?v=1.3"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="map.js?v=1.3"></script>
<script src="obj_listing.js?v=1.3"></script>
<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
}
#app {
    display: flex;
    flex-direction: column;
    height: 100%;
}
</style>
</body>
</html>

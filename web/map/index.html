<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Bunkercaching — Mapa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="../style.css" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans&family=Staatliches&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../data/logo/bunkercaching_pure_logo.png">
</head>
<body>
<div id="app">
    <nav id="navbar">
    <div class="logo">
        <a href="/">
            <img src="../data/logo/bunkercaching_pure_logo.png" alt="Bunkercaching" height="40">
        </a>
    </div>
    <ul id="menu">
      <li><a href="/map">Mapa</a></li>
      <li><a href="/about">O projektu</a></li>
      <li><a href="/auth">Přihlášení</a></li>
    </ul>
    <div class="menu-toggle" onclick="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </nav>
  <script>
    function toggleMenu() {
      document.getElementById("menu").classList.toggle("show");
    }
    document.addEventListener("DOMContentLoaded", () => {
        const navbar = document.getElementById("navbar");
        navbar.style.position = "static"; // default
    });
  </script>
<div id="page">
    <div id="sidebar">
        <div id="sidetop">
            <h1 id="bunker-name" class="center"></h1>
            <h2 id="secret-bunker-name" class="center"></h2>
            <p class="center"><a href="" id="bunker-site" class="mlink">Více na:</a></p>
        </div>
        <div id="sidebottom">
            <form action="", method="get"> <!-- Need to add link to log page -->
                <input type="hidden" name="bunker_id" id="bunker_id" value="">
                <input type="submit" value="Logovat">
            </form>
        </div>
    </div>
    <div id="map"></div>
</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="map.js"></script>
<script src="obj_listing.js"></script>
<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
}
#app {
    display: flex;
    flex-direction: column;
    height: 100%;
}
</style>
</body>
</html>

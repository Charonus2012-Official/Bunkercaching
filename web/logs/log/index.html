<!doctype html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans&family=Staatliches&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../../data/logo/bunkercaching_pure_logo.png">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="log.css">
    <title id="tit"></title>
</head>
<body>
<nav id="navbar"></nav>
<div id="log-page">
    <div class="content-wrapper">
        <h1 id="bi">Načítání...</h1>
        <p class="subtitle">Zapište svou návštěvu nebo uložte koncept pro pozdější úpravy.</p>
        
        <form id="logForm">
            <input type="hidden" name="bunker_id" id="bunker_id">
            <input type="hidden" name="type" id="type">
            
            <div class="form-group">
                <label for="log_text">Text záznamu</label>
                <textarea
                        name="log_text"
                        id="log_text"
                        rows="10"
                        placeholder="Jaký byl váš zážitek z návštěvy?"
                        required
                ></textarea>
            </div>

            <div class="form-footer">
                <label class="checkbox-wrapper">
                    <input type="checkbox" name="concept" value="true">
                    <span class="checkbox-text">Uložit jako koncept</span>
                </label>
                
                <input type="submit" value="Odeslat záznam" class="submit-button">
            </div>
        </form>
    </div>
</div>
<script src="log.js"></script>
<script src="../../navbar.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunkercaching — Přihlášení & Registrace</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="auth.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans&family=Staatliches&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../data/logo/bunkercaching_pure_logo.png">
</head>
<body>
    <nav id="navbar"></nav>
    <div id="about">
        <div class="content-wrapper">
            <h1>Přihlášení & Registrace</h1>
            <p class="subtitle">Připojte se k průzkumníkům betonu.</p>

            <div class="auth-container">
                <!-- Signup -->
                <section class="auth-section">
                    <h2>Registrace</h2>
                    <form id="signupForm">
                        <input class="signlog" type="text" name="username" placeholder="Uživatelské jméno" required>
                        <input class="signlog" type="email" name="email" placeholder="E-mail" required>
                        <input class="signlog" type="password" name="password" placeholder="Heslo" required>
                        <input class="signlog" type="password" name="confirm_password" placeholder="Potvrdit heslo" required>
                        <button type="submit">Registrovat</button>
                    </form>
                    <div id="err_signup" class=""></div>
                </section>

                <!-- Login -->
                <section class="auth-section">
                    <h2>Přihlášení</h2>
                    <form id="loginForm">
                        <input class="signlog" type="text" name="username" placeholder="Uživatelské jméno" required>
                        <input class="signlog" type="password" name="password" placeholder="Heslo" required>
                        <div class="checkb">
                            <label>
                                <input type="checkbox" name="remember" value="true"> Pamatuj si mě
                            </label>
                        </div>
                        <input type="hidden" name="remember" value="false">
                        <button type="submit">Přihlásit se</button>
                    </form>
                    <div id="err_login" class=""></div>
                </section>
            </div>

            <footer>
                <p>&copy; 2026 Bunkercaching. Šířeno pod licencí GNU GPL v3.</p>
            </footer>
        </div>
    </div>
    <script src="auth.js"></script>
    <script src="../navbar.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunkercaching — Přihlášení & Registrace</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="auth.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans&family=Staatliches&display=swap" rel="stylesheet">
</head>
<body>
<div class="split">
    <!-- Signup -->
    <div class="side signup">
        <h1>Registrace</h1>
        <form action="" method="post">
            <input type="text" name="username" placeholder="Uživatelské jméno" required>
            <input type="email" name="email" placeholder="E-mail" required>
            <input type="password" name="password" placeholder="Heslo" required>
            <input type="password" name="confirm_password" placeholder="Potvrdit heslo" required>
            <button type="submit">Registrovat</button>
        </form>
    </div>

    <!-- Login -->
    <div class="side login">
        <h1>Přihlášení</h1>
        <form action="" method="post">
            <input type="text" name="username" placeholder="Uživatelské jméno nebo e-mail" required>
            <input type="password" name="password" placeholder="Heslo" required>
            <button type="submit">Přihlásit se</button>
        </form>
    </div>
</div>
</body>
</html>
